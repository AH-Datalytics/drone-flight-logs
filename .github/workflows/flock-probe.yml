name: Flock cloud probe

# Answers one question: does Flock's Cloudflare challenge clear for a headless
# browser running on a datacenter IP? If it does, collection can be automated
# in the cloud. If it does not, Flock has to run somewhere with a residential
# address. Delete this workflow once the answer is recorded.

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths: ['.github/workflows/flock-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Load one Flock dashboard
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const HOST = 'community.elk-grove.ca.us.aerodome.com';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36';
          const b = await chromium.launch();
          const p = await b.newContext({ userAgent: UA }).then(c => c.newPage());
          const res = await p.goto(`https://${HOST}/flights`, { waitUntil: 'domcontentloaded', timeout: 90000 }).catch(e => { console.log('goto failed:', e.message); return null; });
          console.log('status:', res && res.status());
          let title = '';
          for (let i = 0; i < 30; i++) {
            await p.waitForTimeout(1500);
            title = await p.title().catch(() => '');
            if (!/just a moment/i.test(title)) break;
          }
          console.log('title after wait:', JSON.stringify(title));
          const payload = await p.evaluate(async () => {
            const r = await fetch('/flights?page=1', { headers: { RSC: '1' } });
            return { status: r.status, bytes: (await r.text()).length };
          }).catch(e => ({ status: 'error', bytes: 0, err: e.message }));
          console.log('rsc fetch:', JSON.stringify(payload));
          const ids = await p.evaluate(() => (document.body.innerText.match(/EGPD-\d{6}-\d{4}/g) || []).length);
          console.log('flight numbers visible:', ids);
          console.log(ids > 0 ? 'RESULT: PASS — Flock is collectable from a datacenter IP' : 'RESULT: FAIL — challenge did not clear here');
          await b.close();
          EOF
          node probe.mjs
